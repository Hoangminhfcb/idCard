name: Deploy via Cloudflare Tunnel

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start Cloudflare Tunnel (background)
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          echo "=== Starting authenticated tunnel ==="

          export TUNNEL_SERVICE_TOKEN_ID="${TUNNEL_SERVICE_TOKEN_ID}"
          export TUNNEL_SERVICE_TOKEN_SECRET="${TUNNEL_SERVICE_TOKEN_SECRET}"

          nohup cloudflared access tcp \
            --hostname ssh.zanis.id.vn \
            --url localhost:2222 \
            > cloudflared.log 2>&1 &

          TUNNEL_PID=$!
          echo "Tunnel PID: $TUNNEL_PID"

          echo "Waiting for tunnel to establish..."
          sleep 15

          echo "--- Check if tunnel process is running ---"
          ps aux | grep cloudflared | grep -v grep || echo "Tunnel process not found!"

          echo "--- Tunnel logs ---"
          cat cloudflared.log

          echo "--- Checking port ---"
          ss -ltn | grep 2222 || echo "WARNING: Port 2222 not listening!"

      - name: SSH to your server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "=== Checking tunnel before SSH ==="
          cat cloudflared.log

          echo "=== SSH via tunnel ==="
          sshpass -e ssh -vvv \
            -o ConnectTimeout=30 \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            ${{ secrets.SSH_USER }}@127.0.0.1 \
            "hostname && echo 'SUCCESS!'"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== FULL CLOUDFLARED LOGS ==="
          cat cloudflared.log
          echo ""
          echo "=== NETWORK STATUS ==="
          ss -ltn
          netstat -tuln | grep 2222 || echo "No process on 2222"
