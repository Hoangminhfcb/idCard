name: Deploy via Cloudflare Tunnel

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Cài cloudflared
      - name: Install cloudflared
        run: |
          sudo apt-get update -y
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      # 2️⃣ Start Cloudflare Tunnel (background)
      - name: Start Cloudflare Tunnel (background)
        run: |
          echo "=== Starting authenticated tunnel ==="

          nohup cloudflared access tcp \
            --hostname ssh.zanis.id.vn \
            --url localhost:2222 \
            > cloudflared.log 2>&1 &


          TUNNEL_PID=$!
          echo "Tunnel PID: $TUNNEL_PID"

          echo "Waiting for tunnel to establish..."
          sleep 15

          # wait short time and stream logs until the 'browser' URL line appears or timeout
          SECONDS_WAIT=60
          echo "Waiting up to ${SECONDS_WAIT}s for interactive URL (if any)..."

          found=0
          for i in $(seq 1 $SECONDS_WAIT); do
            if grep -q "A browser window should have opened" cloudflared.log 2>/dev/null; then
              echo ">>> Interactive URL detected at $(date). Dumping log head:"
              # show last 100 lines so Actions log contains the URL
              tail -n 100 cloudflared.log
              found=1
              break
            fi
            sleep 1
          done

          if [ $found -eq 0 ]; then
            echo "No interactive URL found within ${SECONDS_WAIT}s (maybe running headless with service token)."
            echo "Partial log:"
            tail -n 50 cloudflared.log || true
          fi

          # Optionally keep streaming logs in background so next steps can still read them manually if needed
          # (background tail won't block the step)
          tail -f cloudflared.log &

          # show listening ports quickly
          ss -ltn | grep -E '127\.0\.0\.1:|:2222' || ss -ltn || true

      # 3️⃣ SSH qua tunnel
      - name: SSH to your server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "=== Checking tunnel before SSH ==="
          cat cloudflared.log

          echo "=== SSH via tunnel ==="
          sshpass -e ssh -vvv \
            -o ConnectTimeout=30 \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            ${{ secrets.SSH_USER }}@127.0.0.1 \
            "hostname && echo 'SUCCESS!'"

      # 4️⃣ Hiện log nếu lỗi
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== FULL CLOUDFLARED LOGS ==="
          cat cloudflared.log || echo "No cloudflared log found"
          echo ""
          echo "=== NETWORK STATUS ==="
          ss -ltn
