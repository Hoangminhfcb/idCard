name: Deploy via Cloudflare Tunnel

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Cài cloudflared
      - name: Install cloudflared
        run: |
          sudo apt-get update -y
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      # 2️⃣ Start Cloudflare Tunnel (background)
      - name: Start Cloudflare Tunnel (background)
        run: |
          echo "=== Start headless cloudflared access tcp ==="

          nohup cloudflared access tcp \
            --hostname ssh.zanis.id.vn \
            --destination 192.168.23.197:22 \
            --url 127.0.0.1:2222 \
            --service-token-id "${{ secrets.CF_SERVICE_TOKEN_ID }}" \
            --service-token-secret "${{ secrets.CF_SERVICE_TOKEN_SECRET }}" \
            > cloudflared.log 2>&1 &

          sleep 5
          echo "=== cloudflared logs (tail) ==="
          tail -n 50 cloudflared.log || true

          echo "=== check listening ==="
          ss -ltn | grep 127.0.0.1:2222 || echo "127.0.0.1:2222 not listening yet"

      # 3️⃣ SSH qua tunnel
      - name: SSH to your server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "=== Checking tunnel before SSH ==="
          cat cloudflared.log

          echo "=== SSH via tunnel ==="
          sshpass -e ssh -vvv \
            -o ConnectTimeout=30 \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            ${{ secrets.SSH_USER }}@127.0.0.1 \
            "hostname && echo 'SUCCESS!'"

      # 4️⃣ Hiện log nếu lỗi
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== FULL CLOUDFLARED LOGS ==="
          cat cloudflared.log || echo "No cloudflared log found"
          echo ""
          echo "=== NETWORK STATUS ==="
          ss -ltn
