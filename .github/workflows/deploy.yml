name: Deploy via Cloudflare Tunnel

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Lấy code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Build & Push image
      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/zanis-e-card
          TAG=$(date +%Y%m%d%H%M%S)
          docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      # 4️⃣ Cài cloudflared
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      #5️⃣ Mở Cloudflare Tunnel (background)
      - name: Start Cloudflare Tunnel (background)
        run: |
          nohup cloudflared access tcp --hostname ssh.zanis.id.vn --url localhost:22 &
          sleep 5

      # 6️⃣ Add SSH key
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 127.0.0.1 >> ~/.ssh/known_hosts

      # 7️⃣ Deploy qua SSH
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy over SSH
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 22 \
            zanis@ssh.zanis.id.vn << 'EOF'
            set -e
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/zanis-e-card
            IMAGE_TAG=${{ env.IMAGE_TAG }}

            echo "Dừng container cũ (nếu có)..."
            docker stop e-card || true
            docker rm e-card || true

            echo "Xóa image cũ..."
            docker image prune -af

            echo "Pull image mới..."
            docker pull $IMAGE_NAME:$IMAGE_TAG

            echo "Chạy container mới..."
            docker run -d \
              --name e-card \
              -p 80:8080 \
              --restart unless-stopped \
              $IMAGE_NAME:$IMAGE_TAG
          EOF
